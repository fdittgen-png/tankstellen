Name: Sparkilo
Summary: Compare fuel prices, find EV chargers and track what driving costs you
Description: |-
  Sparkilo compares fuel prices near you or along your route and helps you spend
  less to run your car: pay less per litre, see what every kilometre costs, and
  keep a clear record of what you actually spend. It is free, ad-free, open
  source and needs no account. The interface is available in 23 languages.

  Prices come from government open data, or from retailer feeds where no
  national source exists, and every result names its source:

  * Station prices: Austria, France, Germany (free Tankerkönig API key required), Italy, Mexico, Portugal, Slovenia, Spain and the United Kingdom.
  * Denmark: OK, Shell and Q8 stations only.
  * Luxembourg: the national regulated price, shown by city.
  * Greece: regional average prices from official bulletins.

  EV charging locations worldwide come from Open Charge Map, with the connector,
  power and status information it reports.

  '''Find cheaper fuel'''

  * Search nearby or along a route, filtered by fuel type, radius and, where the source provides them, opening hours and amenities.
  * Route mode finds good stops inside your travel corridor, including across a border into another supported country.
  * Per-station and radius price alerts, checked in the background on your device.
  * Favourites with full price rows, and EV chargers showing power and connectors.

  '''Understand your running costs'''

  * Consumption tracking: tank level and range, average L/100 km, cost per kilometre, total spent and fill-up history.
  * Record trips with GPS alone or with a compatible OBD-II (ELM327) adapter; GPS-only figures are estimates calibrated against your fill-ups.
  * Fuel-cost calculator and a CO2 dashboard broken down by trip length and speed band.
  * Closest-station view while recording a trip, a home-screen widget, and spoken price announcements.

  '''Privacy'''

  Your records are stored on the device. A search sends its location to the
  price source for that country, and address, routing, charging and map
  services receive what they need to answer; your Tankerkönig key goes only to
  Tankerkönig. Recorded GPS trips leave the device only if you turn on the
  optional TankSync trip sync. A Privacy Dashboard lets you export everything as
  one ZIP, delete your data, and revoke every consent. Privacy policy (v3):
  https://fdittgen-png.github.io/tankstellen/privacy-policy/

  '''About this F-Droid build'''

  This build leaves out Google Play Services, ML Kit and the Sentry SDK. Maps use
  OpenStreetMap and positioning uses Android's location manager. Because
  receipt and pump-display text recognition relies on Google ML Kit, it is not
  available in this build — add fill-ups by hand instead. QR-code scanning uses
  the open-source ZXing library.
