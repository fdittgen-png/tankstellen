name: Release · Play Store deploy

# Triggered automatically on version tags, or manually for rollout promotion.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - promote-rollout
          - deploy-internal
        default: promote-rollout
      rollout_percentage:
        description: 'Production rollout percentage (for promote-rollout)'
        required: false
        type: choice
        options:
          - '1'
          - '5'
          - '10'
          - '25'
          - '50'
          - '100'
        default: '5'
      track_from:
        description: 'Source track (for promote-rollout)'
        required: false
        type: choice
        # beta (open testing) is the real release track and is kept current by
        # the daily build; internal is rarely updated and defaulting to it
        # silently promotes a stale, lower-versionCode build (#3407).
        options:
          - beta
          - alpha
          - internal
        default: beta
      aab_run_id:
        description: 'CI run ID to download AAB from (for deploy-internal, required for a manual upload; must match the selected source commit)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AAB_PATH: app-play-release.aab
  PACKAGE_NAME: de.tankstellen.fuelprices

permissions:
  contents: read

jobs:
  # --- Job 1: Deploy AAB to Play Store internal track ---
  deploy-internal:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy-internal')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CHANGELOG has an entry for this version
        # #3177 — Unreleased-section discipline: a version must not ship
        # without a `## [X.Y.Z]` entry in CHANGELOG.md. Gates only the
        # tag-triggered release path, so manual rollout promotion of an
        # already-shipped build is never blocked retroactively.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # version is "X.Y.Z" or "X.Y.Z+BUILD" — the CHANGELOG entry is
          # keyed on the bare semver.
          SEMVER="${{ steps.version.outputs.version }}"
          SEMVER="${SEMVER%%+*}"
          if ! grep -qF "## [${SEMVER}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${SEMVER}]' entry. Rename the [Unreleased] section to [${SEMVER}] before tagging a release (#3177)." >&2
            exit 1
          fi
          echo "CHANGELOG entry found for ${SEMVER}."

      - name: Resolve and verify the exact signed CI artifact
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TAG: ${{ steps.version.outputs.tag }}
          REQUESTED_RUN: ${{ inputs.aab_run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RUN_ID="$REQUESTED_RUN"
          if [ "$EVENT" = push ]; then
            # Poll metadata only; never download an unrelated "latest" build.
            for attempt in $(seq 1 60); do
              echo "Waiting for signed source build ($attempt/60)"
              RUN=$(gh run list --workflow ci.yml --event push --commit "$SOURCE_SHA" \
                --limit 50 --json databaseId,status,conclusion,headBranch \
                | jq --arg tag "$SOURCE_TAG" '[.[] | select(.headBranch == $tag)][0]')
              if [ "$(jq -r '.status // ""' <<< "$RUN")" = completed ]; then
                test "$(jq -r .conclusion <<< "$RUN")" = success
                RUN_ID=$(jq -r .databaseId <<< "$RUN")
                break
              fi
              sleep 30
            done
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::No successful signed run for this source; manual uploads require aab_run_id."
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            | jq -e --arg sha "$SOURCE_SHA" \
              '.head_sha == $sha and .conclusion == "success" and .event == "push" and .path == ".github/workflows/ci.yml" and (.head_branch | startswith("v"))'
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" --name android-aab --dir ./artifact
          cp "./artifact/$AAB_PATH" "./$AAB_PATH"

      - name: Upload AAB to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: completed
          releaseName: ${{ steps.version.outputs.tag }}

      - name: Summary
        run: |
          {
            echo "## Play Store Deploy Summary"
            echo ""
            echo "- **Version:** ${{ steps.version.outputs.tag }}"
            echo "- **Track:** internal"
            echo "- **Status:** Uploaded successfully"
            echo ""
            echo "### Next steps"
            echo "1. Test on internal track for 3-5 days"
            echo "2. Promote via workflow dispatch: *promote-rollout* with desired percentage"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Job 2: Promote release through tracks / staged rollout ---
  promote-rollout:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install google-api-python-client
        run: pip install google-api-python-client google-auth

      - name: Promote release
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          TRACK_FROM: ${{ github.event.inputs.track_from }}
          ROLLOUT_PERCENTAGE: ${{ github.event.inputs.rollout_percentage }}
        run: bash scripts/promote_play_store.sh

      - name: Summary
        run: |
          PERCENT="${{ github.event.inputs.rollout_percentage }}"
          FROM="${{ github.event.inputs.track_from }}"
          if [[ "$PERCENT" == "100" ]]; then
            TARGET="production (full rollout)"
          else
            TARGET="production (${PERCENT}% staged rollout)"
          fi
          {
            echo "## Rollout Promotion Summary"
            echo ""
            echo "- **From track:** $FROM"
            echo "- **To:** $TARGET"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PERCENT" != "100" ]]; then
            echo "### Next rollout stage" >> "$GITHUB_STEP_SUMMARY"
            echo "Run this workflow again with a higher percentage when ready." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full rollout complete." >> "$GITHUB_STEP_SUMMARY"
          fi
