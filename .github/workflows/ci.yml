name: CI · Analyze, test & build
on:
  push:
    branches:
    - master
    tags:
    - v*
  pull_request:
    branches:
    - master
  schedule:
  - cron: 0 6 * * 0
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the manual run (audit trail)
        required: false
        default: manual validation (no signing or publication)
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      code: ${{ steps.plan.outputs.code }}
      deps: ${{ steps.plan.outputs.deps }}
      applicable: ${{ steps.plan.outputs.applicable }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
      with:
        resolve: 'false'
        cache-pub: 'false'
    - name: CI script regressions
      run: python3 -m unittest discover -s test/scripts -p 'ci_*_test.py'
    - id: plan
      name: Create one complete test and coverage plan
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python3 scripts/ci/plan.py build
    - uses: actions/upload-artifact@v7
      with:
        name: ci-plan-attempt-${{ github.run_attempt }}
        path: ci-plan/
        if-no-files-found: error
        retention-days: 7
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: Require successful current plan
      env:
        PLAN_RESULT: ${{ needs.changes.result }}
      run: test "$PLAN_RESULT" = success
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
      if: needs.changes.outputs.docs != 'true'
    - uses: ./.github/actions/flutter-setup
      if: needs.changes.outputs.docs != 'true'
    - run: flutter analyze
      if: needs.changes.outputs.docs != 'true'
    - name: Check feature-module boundaries
      run: bash scripts/check_module_boundaries.sh
      if: needs.changes.outputs.docs != 'true'
    timeout-minutes: 15
    needs:
    - changes
    if: ${{ always() }}
  codegen-drift:
    needs:
    - changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - run: dart run build_runner build --delete-conflicting-outputs
    - name: Fail if committed codegen is stale
      run: |
        if ! git diff --exit-code -- '*.g.dart' '*.freezed.dart'; then
          echo "::error::Committed generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the result." >&2
          exit 1
        fi
    timeout-minutes: 15
  l10n-gate:
    needs:
    - changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Rebuild ARB + pseudo-locale + generated localizations
      run: |
        dart tool/build_arb.dart
        dart tool/gen_pseudo_arb.dart
        flutter gen-l10n
    - name: Fail if committed ARB fan-out is stale
      run: |
        if ! git diff --exit-code -- lib/l10n/; then
          echo "::error::Generated ARB / l10n output is stale. Run 'dart tool/build_arb.dart && dart tool/gen_pseudo_arb.dart && flutter gen-l10n' locally and commit the result." >&2
          exit 1
        fi
    - name: Run l10n + lint test buckets
      run: flutter test test/l10n/ test/lint/ --exclude-tags=network
    timeout-minutes: 15
  test:
    needs:
    - changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: ci-plan-attempt-${{ github.run_attempt }}
        path: ci-plan
    - name: Verify candidate and same-attempt plan
      run: python3 scripts/ci/plan.py verify
    - uses: ./.github/actions/flutter-setup
    - name: Run planned shard (plain + measured files once)
      env:
        SHARD: ${{ matrix.shard }}
      run: python3 scripts/ci/run_shard.py --shard "$SHARD"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
        path: ci-results/
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.applicable == 'true') }}
      with:
        name: ${{ github.event_name == 'pull_request' && 'pr-coverage' || 'coverage' }}-shard-${{ matrix.shard }}-attempt-${{
          github.run_attempt }}
        path: coverage/lcov.info
        if-no-files-found: error
        retention-days: 1
    timeout-minutes: 80
  coverage-merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
    - test
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov
    - name: Download shard coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-shard-*-attempt-${{ github.run_attempt }}
        path: coverage-shards
    - name: Merge shard lcov files
      run: |
        mkdir -p coverage
        ARGS=()
        for shard in 0 1 2 3; do
          f="coverage-shards/coverage-shard-${shard}-attempt-${{ github.run_attempt }}/lcov.info"
          test -f "$f" || { echo "::error::Missing coverage shard $shard"; exit 1; }
          ARGS+=(-a "$f")
        done
        lcov "${ARGS[@]}" -o coverage/lcov.info
        echo "Merged ${#ARGS[@]} shard lcov files into coverage/lcov.info"
    - name: Check coverage threshold
      run: bash scripts/check_coverage.sh --threshold 40
    - name: Changed-line policy on full-suite coverage (drift report)
      if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        set -uo pipefail
        if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          echo "::notice::push base $BEFORE is not in this clone (force push?) — no drift report"
          exit 0
        fi
        git diff --unified=0 --no-color -M "$BEFORE" "$GITHUB_SHA" -- lib/ > pushed-lines.diff
        dart tool/coverage_policy.dart --follow-exports --diff pushed-lines.diff --lcov coverage/lcov.info --summary "$GITHUB_STEP_SUMMARY"
        code=$?
        if [ "$code" -ne 0 ]; then
          echo "::warning::Full-suite coverage judges this push differently from the pre-merge policy (exit $code) — see the job summary (#4347)."
        fi
    timeout-minutes: 15
  coverage-policy:
    needs:
    - changes
    - test
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_POLICY_ENFORCE: 'false'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@v8
      continue-on-error: ${{ env.COVERAGE_POLICY_ENFORCE != 'true' }}
      with:
        name: ci-plan-attempt-${{ github.run_attempt }}
        path: ci-plan
    - name: Verify candidate and same-attempt plan
      run: |-
        python3 scripts/ci/plan.py verify
        cp ci-plan/changed-lines.diff changed-lines.diff
      continue-on-error: ${{ env.COVERAGE_POLICY_ENFORCE != 'true' }}
    - uses: ./.github/actions/flutter-setup
      continue-on-error: ${{ env.COVERAGE_POLICY_ENFORCE != 'true' }}
    - name: Download PR shard coverage
      if: needs.changes.outputs.applicable == 'true'
      continue-on-error: ${{ env.COVERAGE_POLICY_ENFORCE != 'true' }}
      uses: actions/download-artifact@v8
      with:
        pattern: pr-coverage-shard-*-attempt-${{ github.run_attempt }}
        path: pr-coverage
    - name: Changed-line coverage policy
      env:
        APPLICABLE: ${{ needs.changes.outputs.applicable }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -uo pipefail
        ENFORCE="${COVERAGE_POLICY_ENFORCE:-false}"
        LEVEL=warning
        if [ "$ENFORCE" = "true" ]; then LEVEL=error; fi
        ARGS=(--follow-exports --diff changed-lines.diff --summary "$GITHUB_STEP_SUMMARY" --annotation-level "$LEVEL")
        if [ "$APPLICABLE" = "true" ]; then
          # Every shard's report is named: a missing one is exit 2.
          for shard in 0 1 2 3; do
            ARGS+=(--lcov "pr-coverage/pr-coverage-shard-${shard}-attempt-${ATTEMPT}/lcov.info")
          done
        fi
        code=0
        dart tool/coverage_policy.dart "${ARGS[@]}" || code=$?
        if [ "$code" -eq 0 ]; then
          exit 0
        fi
        if [ "$ENFORCE" = "true" ]; then
          exit "$code"
        fi
        case "$code" in
          1) why="the changed lines break the coverage policy" ;;
          2) why="coverage evidence is missing or corrupt" ;;
          *) why="the policy tool crashed" ;;
        esac
        echo "::warning title=Changed-line coverage (advisory)::${why} (exit ${code}). Advisory while COVERAGE_POLICY_ENFORCE is not 'true' — see the job summary (#4347)."
        exit 0
  startup-budget:
    runs-on: ubuntu-latest
    needs:
    - changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Check startup time budget
      run: bash scripts/check_startup_budget.sh
    timeout-minutes: 15
  integration:
    needs:
    - changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Run end-to-end integration journeys
      run: flutter test test/integration/
    timeout-minutes: 15
  security-scan:
    needs:
    - changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: OSV vulnerability scan
      uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
      with:
        scan-args: --lockfile=pubspec.lock
    timeout-minutes: 15
  license-audit:
    needs:
    - changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Audit dependency licenses
      run: bash scripts/license_audit.sh
    timeout-minutes: 15
  dependency-check:
    needs:
    - changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/flutter-setup
    - name: Check outdated dependencies and advisories
      run: bash scripts/pub_outdated_check.sh
    timeout-minutes: 15
  build-android:
    runs-on: ubuntu-latest
    needs:
    - analyze
    - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
    - uses: ./.github/actions/flutter-setup
    - uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties')
          }}
        restore-keys: ${{ runner.os }}-gradle-
    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: /usr/local/lib/android/sdk/ndk/27.0.12077973
        key: ${{ runner.os }}-ndk-27.0.12077973
    - name: Pre-install Android NDK (bounded retries)
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        for attempt in 1 2 3; do
          if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973' < /dev/null > /dev/null; then
            break
          fi
          echo "NDK install attempt $attempt failed — cleaning + retrying in 20s (#3543)"
          rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
          sleep 20
        done
        if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
          echo "::error::NDK 27.0.12077973 install failed after 3 attempts (#3543)" >&2
          exit 1
        fi
    - name: Decode signing keystore
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
          echo "::error::Missing one of ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets. Release builds require all three — see #48." >&2
          exit 1
        fi
        KEYSTORE_PATH="$RUNNER_TEMP/tankstellen-release.jks"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
        if ! [ -s "$KEYSTORE_PATH" ]; then
          echo "::error::Decoded keystore is empty or invalid base64" >&2
          exit 1
        fi
        echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
        # #3740 — the keystore PASSWORD is deliberately NOT exported to
        # GITHUB_ENV: that exposes it to every subsequent step (and any
        # compromised action). It is scoped to the build steps' env: blocks.
    - name: Build APK (debug — PR validation)
      if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
      run: flutter build apk --debug --flavor play
    - name: Compute monotonic versionCode
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      id: bn
      run: |
        BN=$(( 2026100000 + ( $(date -u +%s) - 1751760000 ) / 60 ))
        echo "build_number=$BN" >> "$GITHUB_OUTPUT"
        echo "versionCode: $BN"
    - name: Build APK (release, split per ABI)
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: flutter build apk --release --split-per-abi --flavor play --build-number=${{ steps.bn.outputs.build_number }}
    - name: Build App Bundle (release)
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: flutter build appbundle --release --flavor play --build-number=${{ steps.bn.outputs.build_number }}
    - name: Artifact sizes -> job summary
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      run: bash scripts/report_artifact_sizes.sh 'build/app/outputs/flutter-apk/app-*-play-release.apk' 'build/app/outputs/bundle/playRelease/app-play-release.aab'
    - name: Audit — FOREGROUND_SERVICE declarations per artifact (play)
      if: always()
      run: |
        DEBUG_MANIFEST="build/app/intermediates/merged_manifests/playDebug/processPlayDebugManifest/AndroidManifest.xml"
        RELEASE_MANIFEST="build/app/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml"
        if [ -f "$RELEASE_MANIFEST" ]; then
          bash scripts/audit_fgs_declarations.sh --expect-zero --merged "$RELEASE_MANIFEST"
        elif [ -f "$DEBUG_MANIFEST" ]; then
          bash scripts/audit_fgs_declarations.sh --expect-zero --merged "$DEBUG_MANIFEST"
        else
          echo "::error::No merged play manifest found to audit for FGS permissions." >&2
          exit 1
        fi
        bash scripts/audit_fgs_declarations.sh --profile play-fgs-approved
        bash scripts/audit_fgs_declarations.sh --profile fdroid-fgs-approved
    - name: Clean up decoded keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/tankstellen-release.jks"
    - uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-*-play-release.apk
    - uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      with:
        name: android-aab
        path: build/app/outputs/bundle/playRelease/app-play-release.aab
    - uses: actions/upload-artifact@v7
      if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
      with:
        name: android-play-debug-attempt-${{ github.run_attempt }}
        path: build/app/outputs/flutter-apk/app-play-debug.apk
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 40
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
    - build-android
    - analyze
    - test
    - codegen-drift
    - l10n-gate
    - integration
    - startup-budget
    - coverage-merge
    - security-scan
    - license-audit
    - dependency-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        pattern: android-*
    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
    - name: Generate release body
      id: body
      run: |
        {
          echo 'body<<RELEASE_EOF'
          echo "## Tankstellen v${{ steps.version.outputs.version }}"
          echo ""
          echo "### Artifacts"
          echo "- **APK (split per ABI):** Install directly on Android devices"
          echo "- **AAB (App Bundle):** For Google Play Store upload"
          echo ""
          echo "### Installation"
          echo "Download the APK matching your device architecture:"
          echo "- \`app-arm64-v8a-play-release.apk\` — Most modern phones (ARM 64-bit)"
          echo "- \`app-armeabi-v7a-play-release.apk\` — Older phones (ARM 32-bit)"
          echo "- \`app-x86_64-play-release.apk\` — Emulators and x86 devices"
          echo ""
          echo "---"
          echo "*Auto-generated release from tag \`v${{ steps.version.outputs.version }}\`*"
          echo 'RELEASE_EOF'
        } >> "$GITHUB_OUTPUT"
    - uses: softprops/action-gh-release@v3
      with:
        name: v${{ steps.version.outputs.version }}
        body: ${{ steps.body.outputs.body }}
        generate_release_notes: true
        files: |
          android-apk/app-*.apk
          android-aab/app-play-release.aab
    timeout-minutes: 15
permissions:
  contents: read
