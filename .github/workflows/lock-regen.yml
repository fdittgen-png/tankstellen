name: Tools · Regenerate lockfiles

# #3806 (fdroid lock) + #3974 (main lock) — one dispatch instead of a
# manual local dance, for BOTH lockfiles this repo commits.
#
# `pubspec.lock` must be the resolution the Flutter SDK actually produces.
# Dependabot maintains it with plain `dart pub`, which cannot resolve
# `sdk: flutter` and therefore ignores the versions Flutter exact-pins
# (`meta: 1.18.0`, `vector_math: 2.2.0` in packages/flutter/pubspec.yaml;
# `matcher: 0.12.19` in packages/flutter_test/pubspec.yaml). A plain
# `flutter pub get` silently re-resolves rather than failing, so that
# drift stayed invisible until #3974 gave `analyze` an
# `--enforce-lockfile` gate.
#
# `pubspec.fdroid.lock` is a SECOND lockfile: the F-Droid flavour resolves
# with `pubspec_overrides.fdroid.yaml`, which swaps the GMS / ML-Kit /
# Play-Core / Sentry plugins for libre stubs. Dependabot never touches it
# at all, so it goes stale on every pub bump and `build-fdroid` fails on
#
#     flutter pub get --enforce-lockfile
#     -> Unable to satisfy `pubspec.yaml` using `pubspec.lock`.
#
# In both cases nothing about the bump is wrong — a derived file simply
# was not regenerated. Between them this has bitten on #3352, #3563,
# #3773, #3804 and again on #3965, #3966 and #3967.
#
# ## Why dispatch-only, deliberately
#
# The obvious "just run it on the PR" needs `pull_request_target`,
# because a Dependabot PR's own token is read-only. That combination
# would run `flutter pub get` — and therefore arbitrary package BUILD
# HOOKS — from an untrusted branch with a write-scoped token. That is a
# supply-chain foot-gun in exchange for a few minutes of convenience, so
# a human stays in the loop: you read the bump, then dispatch this.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate on (e.g. a dependabot/pub/... branch)'
        required: true
        type: string

concurrency:
  group: lock-regen-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required to push the regenerated lockfiles back onto the branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          # A PAT-free push back to the same branch; the default token
          # suffices because this workflow runs from a TRUSTED ref (the
          # dispatch always uses the workflow file on the default branch).
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as ci.yml — a lockfile resolved by a different SDK
          # would not be the one CI, or the F-Droid buildserver,
          # reproduces.
          flutter-version: "3.44.9"
          cache: true

      - name: Regenerate pubspec.lock
        run: |
          set -euo pipefail
          # Plain resolve, no overrides: this is the normal flavour, and
          # running it through Flutter (not `dart pub`) is the whole point
          # — only Flutter applies the SDK's exact pins.
          flutter pub get

      - name: Regenerate pubspec.fdroid.lock
        run: |
          set -euo pipefail
          cp pubspec.lock /tmp/main.lock
          # Resolve WITH the libre overrides — that combination is what
          # the fdroid lock has to describe.
          dart run tool/apply_fdroid_overrides.dart
          flutter pub get
          cp pubspec.lock pubspec.fdroid.lock
          # Restore the normal flavour so only the fdroid lock is staged.
          cp /tmp/main.lock pubspec.lock
          rm -f pubspec_overrides.yaml

      - name: Verify both locks with the very step that gates CI
        run: |
          set -euo pipefail
          # These are EXACTLY the steps that fail in `analyze` (#3974) and
          # `build-fdroid` (#3806), so green here means green there.
          flutter pub get --enforce-lockfile
          cp pubspec.lock /tmp/main.lock
          dart run tool/apply_fdroid_overrides.dart
          flutter pub get --enforce-lockfile
          cp /tmp/main.lock pubspec.lock
          rm -f pubspec_overrides.yaml

      - name: Commit + push if either lock changed
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock pubspec.fdroid.lock; then
            echo "Both lockfiles already up to date — nothing to push."
            echo "### Lockfiles already current on \`$BRANCH\`" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock pubspec.fdroid.lock
          # Single-line subject + body via repeated -m: a raw multi-line
          # string here would break out of this YAML block scalar.
          git commit \
            -m "build(deps): regenerate lockfiles" \
            -m "pubspec.lock must be the SDK's own resolution and pubspec.fdroid.lock is a second lockfile Dependabot never updates, so both are regenerated through Flutter here (#3974, #3806)."
          git push origin "HEAD:$BRANCH"
          {
            echo "### Regenerated lockfiles on \`$BRANCH\`"
            echo ""
            echo '```'
            git diff HEAD~1 --stat -- pubspec.lock pubspec.fdroid.lock
            echo '```'
            echo ""
            # #3971 — this push used GITHUB_TOKEN, and events from that
            # token deliberately start no workflow run, so the branch now
            # sits on a head SHA with NO checks. Say so here, where the
            # operator is already looking, rather than leaving a silently
            # unverified PR.
            echo "**Now re-fire the checks.** This push used"
            echo "\`GITHUB_TOKEN\`, which by design triggers no workflow"
            echo "run, so the new head SHA carries no results yet:"
            echo ""
            echo '```sh'
            echo "gh workflow run ci.yml --ref $BRANCH       # the CI matrix"
            echo "gh workflow run fdroid.yml --ref $BRANCH   # build-fdroid"
            echo '```'
            echo ""
            echo "Or re-fire everything at once with"
            echo "\`gh pr close <n> && gh pr reopen <n>\`."
          } >> "$GITHUB_STEP_SUMMARY"
