name: Epic
description: New broad program with a validated breakdown; reuse already-approved finite checkpoints
labels: ["type/epic"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you file
        - New broad programs need triage; an already-approved checkpoint is not another epic.
        - Use the [Ready/Done/closure contract](https://github.com/fdittgen-png/tankstellen/blob/master/docs/guides/issue-exit-contract.md) for scope, actual consumers, evidence and the STOP condition.
        - Assign a **Milestone** (iteration) before saving — the board burn-down depends on it.
        - File child issues only after the breakdown has been validated by the maintainer.

  - type: dropdown
    id: triage
    attributes:
      label: Triage classification
      description: Pick the highest-signal category.
      options:
        - "P0 — Critical (blocks release / data loss)"
        - "P1 — High (user-visible regression or key feature)"
        - "P2 — Medium (improvement, polish)"
        - "P3 — Low (nice-to-have, long-tail cleanup)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      description: Which subsystem does most of the work land in?
      options:
        - area/ui
        - area/core
        - area/api
        - area/maps
        - area/route
        - area/alerts
        - area/sync
        - area/ev
        - area/backend
        - area/ci
        - Cross-cutting (multiple areas)
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: |
        One paragraph. What does this Epic deliver? What is explicitly out of scope?
      placeholder: |
        **In scope:** …
        **Out of scope:** …
    validations:
      required: true

  - type: textarea
    id: validation_gate
    attributes:
      label: Validation gate
      description: Observable acceptance, named leaf evidence and a finite STOP condition. Separate code completion from required device/provider/store qualification.
      placeholder: |
        - [ ] <criterion 1>
        - [ ] <criterion 2>
    validations:
      required: true

  - type: textarea
    id: children_table
    attributes:
      label: Child-issue breakdown
      description: |
        Fill this in AFTER the maintainer has validated the breakdown.
        Columns: Sev (P0-P3) | Title (conventional-commit) | Dim (area/x) | Effort (S/M/L) | ARB? (Y/N — needs ARB string changes)
      value: |
        | Sev | Title | Dim | Effort | ARB |
        |-----|-------|-----|--------|-----|
        | P2  | feat(…): … | area/… | S | N |
    validations:
      required: false

  - type: textarea
    id: sequencing
    attributes:
      label: Sequencing note
      description: |
        Name the exact producer checkpoint needed before coding, release-evidence gates and coordination links separately.
        Serialize shared-file writers/merges; disjoint work may proceed without waiting for whole-epic closure.
      placeholder: |
        1. #XXXX (decision / interface) — must merge first
        2. #XXXX, #XXXX — can be bundled in one PR
        3. #XXXX (cleanup) — last
    validations:
      required: false
