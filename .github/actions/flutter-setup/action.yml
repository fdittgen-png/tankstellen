name: Flutter dependencies
description: Pinned SDK and dependency-only cache; never restore build_runner state
inputs:
  lockfile:
    description: Lockfile for this flavor
    default: pubspec.lock
  cache-pub:
    description: Restore dependency packages (false for SDK-only planning)
    default: 'true'
  resolve:
    description: Resolve now (false when a flavor first needs overrides)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: "3.44.9"
        cache: true
        pub-cache: false
    - uses: actions/cache@v6
      if: inputs.cache-pub == 'true'
      with:
        path: ~/.pub-cache
        key: pub-v2-${{ runner.os }}-${{ runner.arch }}-flutter-3.44.9-${{ inputs.lockfile }}-${{ hashFiles(inputs.lockfile) }}
        restore-keys: pub-v2-${{ runner.os }}-${{ runner.arch }}-flutter-3.44.9-${{ inputs.lockfile }}-
    - if: inputs.resolve == 'true'
      shell: bash
      run: flutter pub get --enforce-lockfile
