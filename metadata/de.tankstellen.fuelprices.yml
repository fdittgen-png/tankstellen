#
# OFFICIAL fdroiddata recipe (#2577) — submit this to
# https://gitlab.com/fdroid/fdroiddata by copying it to
# metadata/de.tankstellen.fuelprices.yml in a fork and opening a merge request.
# See docs/guides/fdroid-submission.md for the full fork → lint → build → MR
# flow and the external-review caveats.
#
# This is the REPRODUCIBLE-BUILD recipe: F-Droid's buildserver checks out the
# tagged source and builds the GMS-free `fdroid` flavor itself (unlike the
# self-hosted repo under fdroid/, which ships a prebuilt APK).
#
# #3481 — everything below this comment block mirrors the fdroiddata MR
# !42093 branch `add-sparkilo` BYTE-FOR-BYTE (the MR iterations dropped
# `subdir:`/`gradle:` — the whole-app `flutter build apk --flavor fdroid`
# needs neither — and Summary/Description, which F-Droid reads from the
# upstream fastlane/metadata structure instead).
#
# #4023 — this file is the SOURCE, the MR copy is the derivative. Edit here,
# run `dart run tool/fdroid_canonicalize.dart`, then copy the body up. Never
# hand-edit the GitLab copy and never run `fdroid rewritemeta` locally: local
# ruamel breaks a folded line BEFORE the word that crosses column 80 and
# leaves a trailing space, while fdroiddata CI keeps that word and leaves
# none, so the local tool cannot converge and it also re-flows the prebuild
# shell commands. `fdroid_metadata_canonical_test.dart` implements CI's rule
# directly, which is why no fdroidserver is needed to stay green.
#
# #4445 / ADR 0028 — the `License:` field below describes the PINNED COMMIT,
# not this branch. Every Builds entry pins v6.1.0 (8df4bce4, 2026-10-07), the
# first release after the 2026-09-21 relicense, so AGPL-3.0-or-later is the
# honest value; `fdroid_recipe_licence_matches_pin_test.dart` checks it.
#
# #4510 — no `NonFreeNet`: every pinned commit contains the FDROID_LIBRE
# reader (#3788) and the Clearbit gate (#4516), so this build reaches no
# developer-hosted or proprietary endpoint; the #3968 guard enforces it.
Categories:
  - Market & Price
License: AGPL-3.0-or-later
AuthorName: Florian DITTGEN
AuthorEmail: fdittgen@gmail.com
SourceCode: https://github.com/fdittgen-png/tankstellen
IssueTracker: https://github.com/fdittgen-png/tankstellen/issues

Name: Sparkilo
AutoName: Sparkilo

RepoType: git
Repo: https://github.com/fdittgen-png/tankstellen.git

Builds:
  - versionName: 6.1.0
    versionCode: 51391
    commit: 8df4bce4ffaa35aa521a5e2a45989d7b0b8a0ebc
    output: build/app/outputs/flutter-apk/app-*-fdroid-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:\ "(.*)"/\1/p' .github/workflows/fdroid.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cp pubspec_overrides.fdroid.yaml pubspec_overrides.yaml
      - cp pubspec.fdroid.lock pubspec.lock
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
    scandelete:
      - .pub-cache
      - third_party/google_mlkit_commons
      - third_party/google_mlkit_text_recognition
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --split-per-abi
        --target-platform android-arm --build-number=$(( $$VERCODE$$ / 10 )) --dart-define=FORCE_LOCATION_MANAGER=true
        --dart-define=FGS_FORM_APPROVED=true --dart-define=FDROID_LIBRE=true

